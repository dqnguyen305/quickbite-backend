server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    # Đọc từ biến môi trường, nếu không có thì dùng giá trị mặc định phía sau dấu ":"
    # Mặc định trỏ tới database trên máy chủ 221.121.6.27
    url: ${DB_URL:jdbc:postgresql://221.121.6.27:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.zaxxer.hikari: DEBUG
