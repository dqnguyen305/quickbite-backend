services:
  quickbite-db:
    image: postgres:16
    container_name: quickbite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - quickbite-db-data:/var/lib/postgresql/data

volumes:
  quickbite-db-data:
